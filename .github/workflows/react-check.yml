name: Finly React - validação inicial

on:
  push:
    branches: [Finly-React, codex/finly-navegacao-ux]
  pull_request:
    paths:
      - 'src/**'
      - 'public/legacy/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/react-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Validar TypeScript
        run: npm run check
      - name: Verificar regras financeiras e migração
        run: |
          node tests/check_finance.mjs
          node tests/check_backup.mjs
          node tests/check_entries.mjs
          node tests/check_monthly_spending.mjs
          node tests/check_planning.mjs
          node tests/check_entry_foundation.mjs
          node tests/check_entry_finance.mjs
      - name: Build estático
        run: npm run build
      - name: Verificar salvaguardas e fallback
        run: |
          npm run test:static
          python3 tests/check_public_release.py
          node --check public/legacy/assets/theme.js
      - name: Verificar artefato legado
        run: |
          test -f dist/index.html
          test -f dist/legacy/index.html
          test -f dist/legacy/assets/aurora.css
          test -f dist/legacy/assets/theme.js
